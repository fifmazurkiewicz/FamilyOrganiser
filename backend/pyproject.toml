[tool.poetry]
name = "familyorganiser-backend"
version = "1.0.0"
description = "FamilyOrganiser Backend — REST API for family finance management"
authors = ["FamilyOrganiser Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { version = ">=0.30.6,<0.53.0", extras = ["standard"] }
sqlalchemy = { version = "^2.0.35", extras = ["asyncio"] }
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"
alembic = "^1.13.3"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["argon2"] }
python-multipart = "^0.0.12"
httpx = "^0.27.2"

apscheduler = "^3.10.4"
openpyxl = "^3.1.5"
pydantic = { version = "^2.9.2", extras = ["email"] }
pydantic-settings = "^2.5.2"
python-dotenv = "^1.0.1"
python-dateutil = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-httpx = "^0.30.0"
ruff = "^0.8.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
