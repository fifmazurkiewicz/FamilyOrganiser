# Produkcja na Hetzner: Caddy + backend.
# Deploy: GitHub Actions → scripts/deploy.sh (sekrety z GH → .env na VPS).
# Lokalnie na VPS: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Wymagane w .env / Secrets: DATABASE_URL, SUPABASE_URL, SUPABASE_JWT_SECRET,
# CORS_ORIGINS_STR (= https://family.fmazurkiewicz.dev), SECRET_KEY, ADMIN_EMAIL

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      # Domyślnie CORS pod produkcyjny frontend (nadpisywalne z .env / Secrets)
      CORS_ORIGINS_STR: ${CORS_ORIGINS_STR:-https://family.fmazurkiewicz.dev}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
