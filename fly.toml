# fly.toml — familyorganiser-rtepja (Fly.io Launch, 2026-07-28)
#
# Deploy from latest main:
#   fly deploy -a familyorganiser-rtepja
# Secrets:
#   fly secrets set SECRET_KEY=... ADMIN_PASSWORD=... CORS_ORIGINS_STR=https://familyorganiser-rtepja.fly.dev -a familyorganiser-rtepja

app = 'familyorganiser-rtepja'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  DATABASE_URL = 'sqlite+aiosqlite:////data/familyorg.db'
  ADMIN_EMAIL = 'admin@admin.com'

[[mounts]]
  source = 'familyorg_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
