# fly.toml app configuration file generated for familyorganiser-rtepja on 2026-07-28T15:32:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'familyorganiser-rtepja'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADMIN_EMAIL = 'admin@admin.com'
  DATABASE_URL = 'sqlite+aiosqlite:////data/familyorg.db'
  PORT = '8080'
  STATIC_DIR = '/app/static'

[[mounts]]
  source = 'familyorg_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
